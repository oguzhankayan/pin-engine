[project]
name = "pin-engine"
version = "0.1.0"
readme = "README.md"
license = {text = "MIT"}
description = "Turn any product or post link into scheduled Pinterest pins: keyword-led copy, product-faithful images by Raywake, publishing through Zernio."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15"]

[project.scripts]
pin-engine = "pin_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]
